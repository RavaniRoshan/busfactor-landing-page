name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @figma/astraui-kit has a peerOptional React 18 requirement that conflicts
      # with this project's React 19, so installs need --legacy-peer-deps.
      - run: npm ci --legacy-peer-deps

      - name: Build
        env:
          # Vite reads this for `base`, so assets resolve from /<repo>/ on Pages.
          FIGMA_PUBLIC_URL: /busfactor-landing-page
          VITE_APP_URL: ${{ vars.BUSFACTOR_APP_URL || 'https://heir-weld.vercel.app' }}
          VITE_POSTHOG_KEY: ${{ vars.BUSFACTOR_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.BUSFACTOR_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_DEMO_REPORT_URL: ${{ vars.BUSFACTOR_DEMO_REPORT_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
